# Fork-only: builds Backchannel for Mac (contrib/backchannel/mac/).
#
# With the signing secrets set, the app and DMG are signed with a Developer
# ID and notarized, and a tag publishes a GitHub Release. Without them the
# app is ad-hoc signed and kept only as a workflow artifact, because
# Gatekeeper blocks that build on any other Mac.
#
# Release: push a tag backchannel-mac-v<version>, for example
# backchannel-mac-v1.11. Builds expire 90 days after the commit they're built
# from, so a release needs a recent merge, not just a rebuild.
#
# Secrets, all five or none:
#   MAC_CERTIFICATE_P12          Developer ID Application certificate with its
#                                private key, exported as .p12, base64
#   MAC_CERTIFICATE_PASSWORD     the .p12 export password
#   APPLE_ID                     the Apple ID that notarizes
#   APPLE_APP_SPECIFIC_PASSWORD  an app-specific password for that Apple ID
#   APPLE_TEAM_ID                the team that owns the certificate
# Optional:
#   HOMEBREW_TAP_TOKEN           can push to mikesimone/homebrew-backchannel;
#                                a release then updates the cask there
name: Backchannel Mac
on:
  push:
    tags:
      - 'backchannel-mac-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number for the build, e.g. 1.11 (never publishes)'
        required: true
        default: '0'

permissions:
  contents: read

concurrency:
  group: backchannel-mac-${{ github.ref }}

env:
  TAP_REPOSITORY: mikesimone/homebrew-backchannel

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      signal-version: ${{ steps.version.outputs.signal-version }}
      expires: ${{ steps.expiry.outputs.expires }}
      signed: ${{ steps.signing.outputs.signed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#backchannel-mac-v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::The version must look like 1.11, not '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "signal-version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Check signing secrets
        id: signing
        run: |
          count=0
          for name in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then count=$((count + 1)); fi
          done
          if [ "$count" = 5 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$count" = 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: the app is ad-hoc signed and nothing is published"
          else
            echo "::error::Set all five signing secrets or none ($count of 5 are set)"
            exit 1
          fi
        shell: bash
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          cache-electron-builder: true

      - name: Import the signing certificate
        if: ${{ steps.signing.outputs.signed == 'true' }}
        run: |
          keychain="$RUNNER_TEMP/backchannel-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$password" "$keychain" > /dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application: / { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::MAC_CERTIFICATE_P12 holds no Developer ID Application identity"
            exit 1
          fi
          # electron-builder signs with this identity from this keychain.
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
        shell: bash
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

      - name: Build
        run: contrib/backchannel/mac/build.sh dmg zip
        shell: bash
        env:
          BACKCHANNEL_VERSION: ${{ steps.version.outputs.version }}
          # Empty when unsigned; electron-builder then skips notarizing.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Expiry
        id: expiry
        run: |
          expires="$(node -p 'new Date(require("./config/local-production.json").buildExpiration).toISOString().slice(0, 10)')"
          echo "expires=$expires" >> "$GITHUB_OUTPUT"
          echo "::notice title=Expires::This build stops working on $expires"
        shell: bash

      - name: Smoke test
        # Starts the packaged app and checks that its helper serves the page
        # on 127.0.0.1 behind the token. No Signal account is linked.
        run: |
          app=release/mac-arm64/Backchannel.app
          token_file="$HOME/Library/Application Support/Backchannel/backchannel/token"
          "$app/Contents/MacOS/Backchannel" > smoke.log 2>&1 &
          pid=$!
          up=no
          for _ in $(seq 60); do
            if [ -f "$token_file" ] &&
              curl -s -o /dev/null http://127.0.0.1:47830/; then
              up=yes
              break
            fi
            sleep 2
          done
          bare=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47830/ || true)
          page=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:47830/$(cat "$token_file" 2>/dev/null)/" || true)
          foreign=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.com' \
            "http://127.0.0.1:47830/$(cat "$token_file" 2>/dev/null)/" || true)
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "helper up: $up; no token: $bare; with token: $page; other Host: $foreign"
          if [ "$up" != yes ] || [ "$bare" != 404 ] || [ "$page" != 200 ] ||
            [ "$foreign" != 421 ]; then
            grep -i 'backchannel' smoke.log | tail -n 20 || true
            echo "::error::The helper didn't serve the page as expected"
            exit 1
          fi
        shell: bash

      - name: Sign and notarize the DMG
        if: ${{ steps.signing.outputs.signed == 'true' }}
        run: |
          dmg="release/Backchannel-$VERSION-mac-arm64.dmg"
          codesign --sign "$CSC_NAME" --keychain "$CSC_KEYCHAIN" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json > notarize.json
          status="$(node -p 'require("./notarize.json").status')"
          if [ "$status" != Accepted ]; then
            id="$(node -p 'require("./notarize.json").id')"
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            echo "::error::Notarization of the DMG ended as $status"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute -v release/mac-arm64/Backchannel.app
          spctl --assess --type open --context context:primary-signature -v "$dmg"
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Checksums and cask
        run: |
          mkdir dist
          for ext in dmg zip; do
            cp "release/Backchannel-$VERSION-mac-arm64.$ext" dist/
          done
          cd dist
          shasum -a 256 Backchannel-* > SHA256SUMS
          sha="$(shasum -a 256 "Backchannel-$VERSION-mac-arm64.dmg" | cut -d ' ' -f 1)"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" \
            ../contrib/backchannel/mac/homebrew/backchannel.rb > backchannel.rb
          cat SHA256SUMS
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backchannel-mac-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove the signing keychain
        if: ${{ always() && env.CSC_KEYCHAIN != '' }}
        run: security delete-keychain "$CSC_KEYCHAIN" || true
        shell: bash

  release:
    name: Publish
    needs: build
    if: ${{ github.ref_type == 'tag' && needs.build.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backchannel-mac-${{ needs.build.outputs.version }}
          path: dist

      - name: Create the release
        run: |
          cat > notes.md <<EOF
          Backchannel for Mac $VERSION, built from Signal Desktop $SIGNAL_VERSION.
          Apple Silicon, macOS 14 or later.

          Install with Homebrew:

          \`\`\`
          brew install --cask mikesimone/backchannel/backchannel
          \`\`\`

          or open the DMG and drag Backchannel to Applications. Link it to your
          phone like Signal Desktop. It keeps its own data apart from Signal
          Desktop, and both can run at once.

          This build stops working on $EXPIRES, like every Signal Desktop
          build 90 days after it's made. Install a newer release before then.

          Backchannel is based on Signal Desktop. It is not made, endorsed or
          supported by Signal Messenger.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Backchannel for Mac $VERSION" --notes-file notes.md \
            dist/Backchannel-* dist/SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNAL_VERSION: ${{ needs.build.outputs.signal-version }}
          EXPIRES: ${{ needs.build.outputs.expires }}

  tap:
    name: Update the Homebrew cask
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backchannel-mac-${{ needs.build.outputs.version }}
          path: dist

      - name: Push the cask
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN: copy backchannel.rb from the build to $TAP_REPOSITORY by hand"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/$TAP_REPOSITORY.git" tap
          mkdir -p tap/Casks
          cp dist/backchannel.rb tap/Casks/backchannel.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/backchannel.rb
          if git diff --cached --quiet; then
            echo "The cask is already at $VERSION"
            exit 0
          fi
          git commit -m "Update Backchannel to $VERSION"
          git push
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
